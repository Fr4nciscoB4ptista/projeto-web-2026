<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CineStream: descobre os filmes do momento, explora por género e guarda os teus favoritos.">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <title>CineStream</title>
</head>
<body class="bg-slate-950 text-white min-h-screen">

    <!------- Cabeçalho ------->
    <header class="flex flex-wrap items-center justify-between gap-y-3 p-4 sm:p-6 bg-transparent border-b border-gray-800">
        <a href="paginaprincipal.html" class="text-xl sm:text-2xl font-bold">CineStream</a>
        <!-- No telemóvel o menu passa para uma segunda linha (order-last + w-full) -->
        <nav aria-label="Navegação principal" class="order-last w-full sm:order-0 sm:w-auto">
            <ul class="flex justify-around sm:justify-start sm:gap-8 text-sm">
                <li><a href="explorar.html" class="block py-1 hover:text-gray-400">Explorar</a></li>
                <li><a href="surpreende.html" class="block py-1 hover:text-gray-400">Surpreende-me</a></li>
                <li><a href="minhalista.html" aria-current="page" class="block py-1 text-blue-400 font-semibold">Minha Lista</a></li>
            </ul>
        </nav>
        <div class="flex gap-4 items-center">
            <div class="w-8 h-8 bg-blue-900 rounded border border-blue-500"></div>
        </div>
    </header>

    <!------- Conteúdo Principal ------->
    <main class="py-10 overflow-hidden">
        <h1 class="sr-only">CineStream: filmes em destaque</h1>

        <!-- Secção Tendências (carrossel 3D) -->
        <section class="mb-16" aria-labelledby="titulo-tendencias">
            <h2 id="titulo-tendencias" class="text-center text-xl italic mb-6">Tendências da semana</h2>

            <div class="swiper swiper-tendencias w-full pt-12 pb-12">
                <div class="swiper-wrapper" id="carrosel-tendencias">
                    <!-- O JavaScript injeta os filmes aqui -->
                </div>
            </div>
        </section>

        <!-- Secções por género (criadas pelo JavaScript) -->
        <div id="categorias"></div>
    </main>

    <!------- Rodapé ------->
    <footer class="border-t border-gray-800 p-6 text-center text-sm text-gray-500">
        <p>Projeto escolar · CineStream · Dados fornecidos por TMDB</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const apiKey = '053d489831c6eefd525cc9bc4ba2bb19';
        const base = 'https://api.themoviedb.org/3';
        const imgBase = 'https://image.tmdb.org/t/p';

        // ---------- Utilitários ----------
        function escapar(texto) {
            const div = document.createElement('div');
            div.textContent = texto;
            return div.innerHTML.replace(/"/g, '&quot;');
        }

        // ---------- Minha Lista (localStorage) ----------
        // Mesma chave usada em explorar.html: "minhaLista"
        function lerLista() {
            try {
                return JSON.parse(localStorage.getItem('minhaLista')) || [];
            } catch (e) {
                return [];
            }
        }

        function estaNaLista(id) {
            return lerLista().some(f => f.id === id);
        }

        function alternarLista(filme) {
            let lista = lerLista();
            if (lista.some(f => f.id === filme.id)) {
                lista = lista.filter(f => f.id !== filme.id);
            } else {
                lista.push(filme);
            }
            localStorage.setItem('minhaLista', JSON.stringify(lista));
        }

        function textoBotao(naLista) {
            return naLista ? '✓ Na lista' : '+ Minha Lista';
        }

        // Um só "click" trata todos os botões "+ Minha Lista" da página
        document.addEventListener('click', evento => {
            const botao = evento.target.closest('.btn-lista');
            if (!botao) return;

            const filme = JSON.parse(botao.dataset.filme);
            alternarLista(filme);
            botao.textContent = textoBotao(estaNaLista(filme.id));
        });

        // ---------- CARROSSEL DE TENDÊNCIAS ----------
        fetch(`${base}/trending/movie/week?api_key=${apiKey}&language=pt-PT`)
            .then(resposta => {
                if (!resposta.ok) throw new Error('Resposta inválida: ' + resposta.status);
                return resposta.json();
            })
            .then(dados => {
                const contentor = document.getElementById('carrosel-tendencias');

                // Só filmes com imagem de fundo, para não aparecerem imagens partidas
                const filmes = dados.results.filter(f => f.backdrop_path).slice(0, 10);

                contentor.innerHTML = filmes.map(filme => {
                    const titulo = escapar(filme.title);
                    const ano = filme.release_date ? filme.release_date.split('-')[0] : 'N/A';
                    const nota = filme.vote_average.toFixed(1);

                    return `
                        <div class="swiper-slide relative overflow-hidden rounded-xl shadow-2xl border border-gray-700" style="width: 600px; max-width: 85vw;">
                            <img src="${imgBase}/w780${filme.backdrop_path}" alt="Imagem do filme ${titulo}" class="w-full h-auto object-cover block">

                            <!-- Caixa de informação com degradê -->
                            <div class="absolute bottom-0 left-0 w-full p-4 md:p-6 bg-gradient-to-t from-black/95 via-black/70 to-transparent flex flex-col justify-end">
                                <h3 class="text-white text-lg md:text-2xl font-bold truncate drop-shadow-md">${titulo}</h3>
                                <div class="flex items-center gap-3 mt-1 text-xs md:text-sm text-gray-300">
                                    <span class="font-semibold text-yellow-400">⭐ ${nota}</span>
                                    <span>•</span>
                                    <span>${ano}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                new Swiper('.swiper-tendencias', {
                    effect: 'coverflow',
                    grabCursor: true,
                    centeredSlides: true,
                    slidesPerView: 'auto',
                    loop: true,
                    autoplay: {
                        delay: 4000,
                        pauseOnMouseEnter: true,
                        disableOnInteraction: false
                    },
                    coverflowEffect: {
                        rotate: 30,
                        stretch: 250,
                        depth: 250,
                        modifier: 1,
                        slideShadows: true
                    }
                });
            })
            .catch(erro => {
                console.error('Erro ao carregar tendências:', erro);
                document.getElementById('carrosel-tendencias').innerHTML =
                    '<p class="text-center text-gray-400 w-full">Não foi possível carregar as tendências.</p>';
            });

        // ---------- CARROSSÉIS POR CATEGORIA ----------
        // Para acrescentar uma secção basta acrescentar uma linha a esta lista.
        // "genero" é o id do género no TMDB; "ordem" é o critério de ordenação.
        const categorias = [
            { id: 'acao',     titulo: 'Ação',              genero: 28,  ordem: 'popularity.desc' },
            { id: 'comedia',  titulo: 'Comédia',           genero: 35,  ordem: 'popularity.desc' },
            { id: 'ficcao',   titulo: 'Ficção Científica', genero: 878, ordem: 'popularity.desc' },
            { id: 'terror',   titulo: 'Terror',            genero: 27,  ordem: 'popularity.desc' },
            { id: 'drama',    titulo: 'Drama',             genero: 18,  ordem: 'vote_average.desc' }
        ];

        function criarCartaz(filme) {
            const titulo = escapar(filme.title);
            const nota = filme.vote_average ? filme.vote_average.toFixed(1) : '–';

            const dados = escapar(JSON.stringify({
                id: filme.id,
                title: filme.title,
                poster_path: filme.poster_path,
                vote_average: filme.vote_average,
                release_date: filme.release_date
            }));

            return `
                <div class="swiper-slide" style="width: 180px;">
                    <div class="relative transition-transform hover:scale-105">
                        <img src="${imgBase}/w500${filme.poster_path}" alt="Cartaz do filme ${titulo}" loading="lazy"
                            class="w-full h-auto rounded-lg shadow-md border border-gray-800 aspect-[2/3] object-cover bg-slate-900">
                        <span class="absolute top-2 right-2 bg-black/70 text-yellow-400 text-xs font-semibold px-2 py-1 rounded">⭐ ${nota}</span>
                    </div>
                    <h3 class="mt-2 text-sm text-gray-200 font-medium truncate" title="${titulo}">${titulo}</h3>
                    <button type="button" data-filme="${dados}"
                        class="btn-lista mt-1 w-full text-xs py-1 rounded border border-blue-500 hover:bg-blue-900 transition-colors">
                        ${textoBotao(estaNaLista(filme.id))}
                    </button>
                </div>
            `;
        }

        function criarCategoria(categoria) {
            const url = `${base}/discover/movie?api_key=${apiKey}&language=pt-PT&with_genres=${categoria.genero}&sort_by=${categoria.ordem}&vote_count.gte=300&page=1`;

            // Estrutura da secção
            const seccao = document.createElement('section');
            seccao.className = 'mb-14 pl-6';
            seccao.setAttribute('aria-labelledby', `titulo-${categoria.id}`);
            seccao.innerHTML = `
                <div class="flex items-baseline justify-between pr-6 mb-4">
                    <h2 id="titulo-${categoria.id}" class="text-xl font-bold">${categoria.titulo}</h2>
                    <a href="explorar.html" class="text-sm text-blue-400 hover:text-blue-300">Ver mais →</a>
                </div>
                <div class="swiper swiper-${categoria.id} w-full py-4 overflow-visible">
                    <div class="swiper-wrapper"></div>
                </div>
            `;
            document.getElementById('categorias').appendChild(seccao);

            // Dados da API
            fetch(url)
                .then(resposta => {
                    if (!resposta.ok) throw new Error('Resposta inválida: ' + resposta.status);
                    return resposta.json();
                })
                .then(dados => {
                    const filmes = dados.results.filter(f => f.poster_path);
                    seccao.querySelector('.swiper-wrapper').innerHTML = filmes.map(criarCartaz).join('');

                    new Swiper(`.swiper-${categoria.id}`, {
                        slidesPerView: 'auto',
                        spaceBetween: 20,
                        grabCursor: true,
                        freeMode: true
                    });
                })
                .catch(erro => {
                    console.error(`Erro ao carregar ${categoria.titulo}:`, erro);
                    seccao.querySelector('.swiper-wrapper').innerHTML =
                        '<p class="text-gray-400">Não foi possível carregar esta secção.</p>';
                });
        }

        categorias.forEach(criarCategoria);
    </script>
</body>
</html>
